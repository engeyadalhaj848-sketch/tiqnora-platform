  <style>
  :root{--blue:#0A5CFF;--cyan:#00D2FF;--navy:#060B1E;--text:#0B1529;--muted:#6B7C93;--line:#E5EAF1;--soft:#F7F9FC}
  *{box-sizing:border-box}body{margin:0;background:#fff;color:var(--text);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif}a{color:inherit}.container{width:min(1180px,calc(100% - 32px));margin:auto}
  .top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.nav{min-height:72px;display:flex;align-items:center;gap:22px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;color:var(--navy);margin-inline-end:auto}.brand img{width:38px;height:38px;object-fit:contain}.nav-links{display:flex;gap:18px;align-items:center}.nav-links a{text-decoration:none;color:#3A4A63;font-weight:600;font-size:.92rem}.nav-links a:hover,.nav-links a.active{color:var(--blue)}
  .hero{padding:72px 0 46px;background:linear-gradient(180deg,#F5F9FF 0%,#fff 100%);border-bottom:1px solid #F0F3F8}.eyebrow{color:var(--blue);font-weight:800;font-size:.82rem;letter-spacing:.04em}.hero h1{font-size:clamp(2.2rem,6vw,4.4rem);line-height:1.08;margin:10px 0 14px;color:var(--navy)}.hero p{max-width:720px;color:var(--muted);font-size:1.08rem;line-height:1.9;margin:0}
  .content{padding:44px 0 70px}.featured{display:grid;grid-template-columns:1.05fr .95fr;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 14px 50px rgba(11,21,41,.06);margin-bottom:34px}.featured-media,.card-media{background:radial-gradient(circle at 20% 20%,rgba(0,210,255,.26),transparent 36%),linear-gradient(135deg,#061330,#0A5CFF);min-height:270px;display:grid;place-items:center;overflow:hidden}.featured-media img,.card-media img{width:100%;height:100%;object-fit:cover}.brand-art{width:92px!important;height:92px!important;object-fit:contain!important;filter:drop-shadow(0 15px 25px rgba(0,0,0,.2))}.featured-body{padding:34px}.category{display:inline-flex;padding:6px 10px;border-radius:999px;background:#F0F6FF;color:var(--blue);font-size:.75rem;font-weight:800}.featured h2{font-size:clamp(1.5rem,3vw,2.35rem);line-height:1.45;margin:14px 0 10px;color:var(--navy)}.excerpt{color:var(--muted);line-height:1.85}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.8rem;margin-top:16px}.read{display:inline-flex;margin-top:18px;color:var(--blue);font-weight:800;text-decoration:none}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:34px 0 18px}.section-head h2{margin:0;color:var(--navy);font-size:1.55rem}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.post-card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;transition:.2s ease;min-width:0}.post-card:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(11,21,41,.08)}.card-media{min-height:160px}.card-body{padding:20px}.post-card h3{margin:10px 0 8px;color:var(--navy);font-size:1.1rem;line-height:1.55}.post-card h3 a{text-decoration:none}.footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:.85rem}
  @media(max-width:900px){.featured{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.nav-links a:not(.active){display:none}}@media(max-width:620px){.hero{padding:48px 0 34px}.grid{grid-template-columns:1fr}.featured-body{padding:22px}.container{width:min(100% - 22px,1180px)}}
  </style>
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"Blog","name":"مدونة Tiqnora AI","url":"https://www.tiqnora.com/blog","publisher":{"@type":"Organization","name":"Tiqnora AI"}}</script>
</head>
<body>
<header class="top"><div class="container nav"><a class="brand" href="/"><img src="/assets/tiqnora-logo.png" alt="Tiqnora AI"><span>Tiqnora AI</span></a><nav class="nav-links"><a href="/">الرئيسية</a><a href="/#services">الخدمات</a><a class="active" href="/blog">المدونة</a><a href="/shop">المتجر</a></nav></div></header>
<section class="hero"><div class="container"><div class="eyebrow">TIQNORA INSIGHTS</div><h1>مدونة تيقنورا</h1><p>رؤى عملية في التقنية، الذكاء الاصطناعي، الأتمتة، تصميم المواقع ونمو الأعمال.</p></div></section>
<main class="content"><div class="container"><div id="list"><p class="excerpt">جارٍ تحميل المقالات…</p></div></div></main>
<footer class="footer"><div class="container">© Tiqnora AI · المدينة المنورة، المملكة العربية السعودية</div></footer>
<script src="/js/config.js"></script><script src="/js/analytics.js"></script><script src="/js/db.js"></script><script src="/js/supabase-client-fix.js"></script>
<script>
(async()=>{const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const media=p=>esc(p.featured_image||p.cover_image||p.image_url||'');const readTime=p=>Math.max(2,Math.round(String(p.body_ar||p.excerpt_ar||'').split(/\s+/).length/180));await window.TiqnoraDB.ready();const db=window.TiqnoraDB.raw,el=document.getElementById('list');if(!db){el.innerHTML='<p class="excerpt">تعذر الاتصال حاليًا.</p>';return}const {data,error}=await db.from('blog_posts').select('*').eq('status','published').order('published_at',{ascending:false});if(error){el.innerHTML='<p class="excerpt">تعذر تحميل المقالات الآن.</p>';return}const posts=data||[];if(!posts.length){el.innerHTML='<p class="excerpt">لا توجد مقالات منشورة بعد.</p>';return}const cardMedia=p=>media(p)?'<img src="'+media(p)+'" alt="'+esc(p.title_ar)+'" loading="lazy">':'<img class="brand-art" src="/assets/tiqnora-logo.png" alt="" loading="lazy">';const tags=p=>(p.tags||[]);const category=p=>esc(tags(p)[0]||'تقنية وذكاء اصطناعي');const date=p=>p.published_at?new Date(p.published_at).toLocaleDateString('ar-SA'):'';const first=posts[0];const featured='<article class="featured"><div class="featured-media">'+cardMedia(first)+'</div><div class="featured-body"><span class="category">'+category(first)+'</span><h2>'+esc(first.title_ar)+'</h2><p class="excerpt">'+esc(first.excerpt_ar||'')+'</p><div class="meta"><span>'+date(first)+'</span><span>•</span><span>'+readTime(first)+' دقائق قراءة</span></div><a class="read" href="/blog/'+encodeURIComponent(first.slug)+'">اقرأ المقال ←</a></div></article>';const grid=posts.slice(1).map(p=>'<article class="post-card"><div class="card-media">'+cardMedia(p)+'</div><div class="card-body"><span class="category">'+category(p)+'</span><h3><a href="/blog/'+encodeURIComponent(p.slug)+'">'+esc(p.title_ar)+'</a></h3><p class="excerpt">'+esc(p.excerpt_ar||'')+'</p><div class="meta"><span>'+date(p)+'</span><span>•</span><span>'+readTime(p)+' دقائق</span></div><a class="read" href="/blog/'+encodeURIComponent(p.slug)+'">اقرأ المقال ←</a></div></article>').join('');el.innerHTML=featured+(grid?'<div class="section-head"><h2>أحدث المقالات</h2></div><section class="grid">'+grid+'</section>':'')})();
</script></body></html>
