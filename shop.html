<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0A5CFF" />
  <meta name="description" content="متجر حلول تقنية Tiqnora AI في السعودية — كمبيوترات، شبكات، كاميرات مراقبة، طابعات، مكتب ذكي، وحلول AI رقمية." />
  <link rel="canonical" href="https://www.tiqnora.com/shop" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ar_SA" />
  <meta property="og:site_name" content="Tiqnora AI" />
  <meta property="og:title" content="المتجر | Tiqnora AI" />
  <meta property="og:description" content="كتالوج تقني متكامل: أجهزة، شبكات، أمن، طباعة، مكتب ذكي وحلول رقمية." />
  <meta property="og:url" content="https://www.tiqnora.com/shop" />
  <meta property="og:image" content="https://www.tiqnora.com/assets/tiqnora-logo.png" />
  <title>المتجر | Tiqnora AI</title>
  <link rel="icon" type="image/png" href="assets/tiqnora-logo.png" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    :root{
      --surface:#081120;
      --surface-2:#0b1628;
      --line:rgba(255,255,255,.10);
    }
    .store-header{
      position:sticky;top:0;z-index:50;
      background:rgba(3,7,18,.92);
      border-bottom:1px solid var(--line);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }
    .store-nav{
      min-height:68px;
      display:flex;
      align-items:center;
      gap:18px;
    }
    .store-nav .brand{
      display:flex;align-items:center;gap:9px;
      font-weight:800;white-space:nowrap;
    }
    .store-nav .brand img{width:34px;height:34px;object-fit:contain}
    .store-links{
      display:flex;align-items:center;gap:16px;
      margin-inline:auto;
      color:var(--text-soft);
      font-size:.92rem;
      white-space:nowrap;
    }
    .store-links a{padding:8px 2px}
    .store-links a.active,.store-links a:hover{color:var(--cyan)}
    .cart-link{
      display:inline-flex;align-items:center;gap:7px;
      padding:9px 13px;border:1px solid var(--border-strong);
      border-radius:999px;background:rgba(10,92,255,.09);
      white-space:nowrap;font-weight:700;
    }
    .cart-link b{
      min-width:23px;height:23px;border-radius:999px;
      display:grid;place-items:center;
      background:var(--blue);color:#fff;font-size:.78rem;
    }
    .store-main{padding:34px 0 26px}
    .store-title{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.2;margin-bottom:7px}
    .store-sub{color:var(--text-soft);margin-bottom:22px;max-width:850px}
    .shop-filters{
      display:grid;
      grid-template-columns:minmax(220px,1.5fr) repeat(4,minmax(130px,1fr));
      gap:10px;margin:0 0 16px;
    }
    .shop-filters input,.shop-filters select{
      width:100%;min-width:0;height:46px;
      padding:0 12px;border-radius:12px;
      border:1px solid var(--line);
      background:var(--surface);color:var(--text);
      font:inherit;outline:none;
    }
    .shop-filters input:focus,.shop-filters select:focus{
      border-color:var(--cyan);
      box-shadow:0 0 0 3px rgba(0,229,255,.08);
    }
    .chip-row{display:flex;gap:8px;flex-wrap:wrap}
    .chip-row a,.chip-row button,.chip-row .chip{
      border:1px solid var(--line);background:var(--surface);
      color:var(--text-soft);padding:7px 11px;border-radius:999px;
    }
    .chip-row .active{border-color:var(--cyan);color:var(--cyan)}
    .shop-meta-row{
      display:flex;justify-content:space-between;align-items:center;
      gap:12px;flex-wrap:wrap;margin:14px 0;
      color:var(--muted);font-size:.9rem;
    }
    .products-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:16px;
      align-items:stretch;
    }
    .product-card{
      position:relative;min-width:0;overflow:hidden;
      display:flex;flex-direction:column;
      border:1px solid var(--line);
      border-radius:18px;
      background:linear-gradient(180deg,rgba(11,22,40,.95),rgba(7,14,27,.98));
      box-shadow:0 10px 30px rgba(0,0,0,.18);
      transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
    }
    .product-card:hover{
      transform:translateY(-3px);
      border-color:rgba(0,229,255,.3);
      box-shadow:0 18px 38px rgba(0,0,0,.28);
    }
    .product-thumb{
      width:100%;
      aspect-ratio:1/1;
      min-height:0!important;
      display:grid;place-items:center;
      overflow:hidden;
      padding:14px;
      background:#fff;
      color:#64748b;
    }
    .product-thumb img{
      width:100%!important;
      height:100%!important;
      max-width:100%;
      max-height:100%;
      object-fit:contain!important;
      object-position:center;
    }
    .product-body{
      display:flex;flex-direction:column;gap:7px;
      padding:14px 14px 16px;
      flex:1;
    }
    .p-cat{color:var(--muted);font-size:.78rem;line-height:1.4}
    .product-body h3{
      font-size:.98rem;line-height:1.55;
      margin:0;color:var(--text);
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
      overflow:hidden;
    }
    .product-price{
      display:flex;align-items:center;gap:8px;flex-wrap:wrap;
      margin-top:auto;padding-top:3px;
    }
    .product-price strong{font-size:1.03rem;color:#fff}
    .product-price s{font-size:.82rem;color:var(--muted)}
    .badge{
      position:absolute;top:10px;inset-inline-start:10px;z-index:2;
      padding:5px 8px;border-radius:999px;
      background:var(--blue);color:#fff;font-size:.72rem;font-weight:800;
      box-shadow:0 6px 16px rgba(10,92,255,.24);
    }
    .badge.out{background:#7f1d1d}
    .button,.button-ghost{
      min-height:44px;padding:9px 18px;border-radius:12px;
      border:1px solid var(--border-strong);
      color:var(--text);background:var(--surface);
      font:inherit;font-weight:700;
    }
    .store-footer{
      border-top:1px solid var(--line);
      color:var(--muted);
      padding:24px 0 32px;margin-top:28px;
      font-size:.9rem;
    }
    @media(max-width:1080px){
      .products-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
      .shop-filters{grid-template-columns:repeat(2,minmax(0,1fr))}
      .shop-filters input{grid-column:1/-1}
    }
    @media(max-width:760px){
      .container{width:min(100% - 1rem,var(--max))}
      .store-nav{min-height:62px;gap:10px;flex-wrap:wrap;padding-block:8px}
      .store-nav .brand img{width:30px;height:30px}
      .store-nav .brand span{font-size:.95rem}
      .store-links{
        order:3;width:100%;overflow-x:auto;
        margin:0;padding-bottom:2px;gap:14px;
        scrollbar-width:none;
      }
      .store-links::-webkit-scrollbar{display:none}
      .cart-link{margin-inline-start:auto;padding:7px 10px}
      .store-main{padding-top:24px}
      .store-sub{font-size:.9rem;margin-bottom:16px}
      .products-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
      .product-thumb{padding:10px}
      .product-body{padding:10px 10px 12px;gap:5px}
      .product-body h3{font-size:.88rem}
      .product-price strong{font-size:.92rem}
      .p-cat{font-size:.7rem}
      .badge{top:7px;inset-inline-start:7px;font-size:.66rem}
    }
    @media(max-width:480px){
      .shop-filters{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
      .shop-filters input{grid-column:1/-1}
      .shop-filters input,.shop-filters select{height:44px;font-size:.86rem;padding-inline:9px}
      .shop-meta-row{font-size:.8rem;gap:8px}
      .products-grid{gap:8px}
      .product-card{border-radius:14px}
      .product-body h3{font-size:.84rem}
    }
  </style>

</head>
<body>
  <header class="store-header">
    <div class="container store-nav">
      <a class="brand" href="index.html"><img src="assets/tiqnora-logo.png" alt="Tiqnora AI" /><span>Tiqnora AI</span></a>
      <nav class="store-links" aria-label="المتجر">
        <a href="index.html">الرئيسية</a>
        <a href="shop.html" class="active">المتجر</a>
        <a href="national-day.html">اليوم الوطني</a>
        <a href="track.html">تتبع الطلب</a>
      </nav>
      <a class="cart-link" href="checkout.html"> السلة <b id="store-cart-count">0</b></a>
    </div>
  </header>
  <main class="store-main">
    <div class="container">
      <h1 class="store-title">المتجر</h1>
      <p class="store-sub">كمبيوترات · شبكات · مراقبة وأمن · طابعات · مكتب ذكي · حلول AI — شحن داخل المملكة.</p>

      <div class="shop-filters" id="shop-filters">
        <input type="search" id="f-q" placeholder="ابحث عن منتج..." autocomplete="off" />
        <select id="f-cat" aria-label="القسم"><option value="">كل الأقسام</option></select>
        <select id="f-brand" aria-label="العلامة"><option value="">كل العلامات</option></select>
        <select id="f-price" aria-label="السعر">
          <option value="">كل الأسعار</option>
          <option value="0-200">حتى 200 ر.س</option>
          <option value="200-500">200 – 500</option>
          <option value="500-1500">500 – 1,500</option>
          <option value="1500-5000">1,500 – 5,000</option>
          <option value="5000-999999">أكثر من 5,000</option>
        </select>
        <select id="f-status" aria-label="الحالة">
          <option value="">كل الحالات</option>
          <option value="in">متوفر</option>
          <option value="out">غير متوفر</option>
          <option value="featured">مميز</option>
          <option value="national">عروض وطنية</option>
        </select>
      </div>

      <div class="chip-row" id="section-chips" style="margin-bottom:10px"></div>
      <div class="chip-row" id="cat-chips"></div>
      <div class="shop-meta-row"><span id="shop-result-meta"></span>
        <span id="result-count">—</span>
        <a href="faq.html" style="color:var(--accent)">الأسئلة الشائعة</a>
      </div>
      <div class="products-grid" id="products-grid">
        <p style="color:var(--muted)">جارٍ تحميل المنتجات…</p>
      </div>
    </div>
  </main>
  <section class="container" style="padding:28px 0 10px">
    <h2 style="font-size:1.2rem;margin-bottom:12px">الأقسام الرئيسية</h2>
    <div class="chip-row" id="cat-links"></div>
  </section>
  <footer class="store-footer"><div class="container">© <span id="year"></span> Tiqnora AI · <a href="national-day.html">عروض اليوم الوطني</a> · <a href="about.html">عن الشركة</a> · <a href="privacy-policy.html">الخصوصية</a> · <a href="terms.html">الشروط</a></div></footer>
  <script src="js/config.js" defer></script>
  <script src="js/db.js" defer></script>
  <script src="script.js" defer></script>
  <script src="js/analytics.js" defer></script>
  <script src="js/whatsapp.js" defer></script>
  <script defer>
  window.addEventListener('DOMContentLoaded', () => {
    const money = n => `${new Intl.NumberFormat('ar-SA').format(Number(n)||0)} ر.س`;
    const esc = s => String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    const grid = document.querySelector('#products-grid');
    const year = document.querySelector('#year'); if (year) year.textContent = new Date().getFullYear();
    const PAGE = 12;
    let offset = 0;
    let total = 0;
    let loading = false;
    let allLoaded = []; // accumulated for client filter when needed
    let section = 'all';
    let brands = [];

    const params = new URLSearchParams(location.search);
    const initialCat = params.get('cat') || '';

    function renderCount(){
      const c = (window.TiqnoraStore?.getCart()||[]).reduce((a,i)=>a+i.qty,0);
      const el = document.querySelector('#store-cart-count');
      if (el) el.textContent = c;
    }
    function finalPrice(p){
      const d = Number(p.discount_percent)||0;
      return d > 0 ? p.price * (1 - d / 100) : Number(p.price)||0;
    }
    function inStock(p){ return !(p.track_stock && p.stock_quantity <= 0); }

    function skeleton(n = 8) {
      return Array.from({ length: n }, () =>
        `<div class="product-card" aria-hidden="true" style="pointer-events:none;opacity:.55">
          <div class="product-thumb" style="background:var(--line);min-height:160px;border-radius:12px"></div>
          <div class="product-body"><div style="height:12px;background:var(--line);border-radius:6px;margin:8px 0"></div>
          <div style="height:16px;background:var(--line);border-radius:6px;width:70%"></div></div></div>`
      ).join('');
    }

    function card(p, idx) {
      const hasDisc = Number(p.discount_percent) > 0;
      const final = finalPrice(p);
      const out = !inStock(p);
      const img = (p.images && p.images[0]) ? p.images[0] : '';
      const priority = idx < 2 ? 'fetchpriority="high"' : '';
      const lazy = idx < 2 ? '' : 'loading="lazy"';
      return `<a class="product-card" href="product.html?slug=${encodeURIComponent(p.slug)}">
        ${out ? '<span class="badge out">غير متوفر</span>' : (hasDisc ? `<span class="badge">-${Math.round(p.discount_percent)}%</span>` : (p.featured ? '<span class="badge">مميز</span>' : ''))}
        <div class="product-thumb">${img
          ? `<img src="${esc(img)}" alt="${esc(p.name_ar)}" width="400" height="400" decoding="async" ${lazy} ${priority} style="width:100%;height:100%;object-fit:contain">`
          : '▣'}</div>
        <div class="product-body">
          <span class="p-cat">${esc(p.categories?.name_ar || '')}${p.brands?.name ? ' · ' + esc(p.brands.name) : ''}</span>
          <h3>${esc(p.name_ar)}</h3>
          <div class="product-price"><strong>${money(final)}</strong>${hasDisc?`<s>${money(p.price)}</s>`:''}</div>
        </div></a>`;
    }

    function meta(shown) {
      const el = document.querySelector('#shop-result-meta');
      if (el) el.textContent = total
        ? `عرض ${shown} من ${total}`
        : (shown ? `${shown} منتج` : '');
    }

    function ensureLoadMore() {
      let btn = document.querySelector('#shop-load-more');
      if (!btn) {
        btn = document.createElement('button');
        btn.id = 'shop-load-more';
        btn.type = 'button';
        btn.className = 'button button-ghost';
        btn.style.cssText = 'display:block;margin:22px auto 8px;min-width:180px';
        btn.textContent = 'عرض المزيد';
        grid.after(btn);
        btn.addEventListener('click', () => loadPage(false));
      }
      return btn;
    }

    function applyClientSection(list) {
      if (section === 'featured') return list.filter(p => !!p.featured);
      if (section === 'best') return list; // tags often not on slim payload
      if (section === 'national') return list.filter(p => p.categories?.slug === 'national-day');
      return list;
    }

    async function loadPage(reset) {
      if (loading) return;
      loading = true;
      const btn = ensureLoadMore();
      btn.disabled = true;
      btn.textContent = 'جارٍ التحميل…';

      if (reset) {
        offset = 0;
        allLoaded = [];
        grid.innerHTML = skeleton(8);
      }

      const q = (document.querySelector('#f-q')?.value || '').trim();
      const cat = document.querySelector('#f-cat')?.value || null;
      const brand = document.querySelector('#f-brand')?.value || null;

      try {
        const page = await window.TiqnoraDB.getProductsPage({
          limit: PAGE,
          offset,
          cat: cat || null,
          brand: brand || null,
          q: q || null,
        });
        if (!page || !page.items) {
          if (reset) grid.innerHTML = '<p style="color:var(--muted)">لا توجد منتجات.</p>';
          return;
        }
        total = page.total || 0;
        let items = applyClientSection(page.items);
        if (reset) {
          allLoaded = items;
          grid.innerHTML = items.map((p, i) => card(p, i)).join('') || '<p style="color:var(--muted)">لا توجد منتجات مطابقة.</p>';
        } else {
          allLoaded = allLoaded.concat(items);
          const frag = document.createDocumentFragment();
          const wrap = document.createElement('div');
          wrap.innerHTML = items.map((p, i) => card(p, offset + i)).join('');
          while (wrap.firstChild) frag.appendChild(wrap.firstChild);
          grid.appendChild(frag);
        }
        offset += PAGE;
        meta(allLoaded.length);
        const hasMore = page.hasMore && allLoaded.length < (total || Infinity);
        btn.style.display = hasMore ? 'block' : 'none';
        btn.disabled = false;
        btn.textContent = 'عرض المزيد';
      } catch (e) {
        console.warn(e);
        if (reset) grid.innerHTML = '<p style="color:var(--muted)">تعذر تحميل المنتجات.</p>';
        btn.disabled = false;
        btn.textContent = 'عرض المزيد';
      } finally {
        loading = false;
        renderCount();
      }
    }

    async function loadBrandsAndCats() {
      try {
        const [brandRows, catRows] = await Promise.all([
          window.TiqnoraDB.getBrands?.() || [],
          window.TiqnoraDB.getCategories?.() || [],
        ]);
        brands = brandRows || [];
        const brandSel = document.querySelector('#f-brand');
        if (brandSel && brands.length) {
          const cur = brandSel.value;
          brandSel.innerHTML = '<option value=\"\">كل العلامات</option>' +
            brands.map(b => `<option value=\"${esc(b.slug)}\">${esc(b.name || b.name_ar || b.slug)}</option>`).join('');
          brandSel.value = cur;
        }
        const catSel = document.querySelector('#f-cat');
        if (catSel && catRows && catRows.length) {
          const cur = catSel.value;
          const productCats = catRows.filter(c => !c.type || c.type === 'product' || c.type === 'products');
          if (productCats.length) {
            catSel.innerHTML = '<option value=\"\">كل التصنيفات</option>' +
              productCats.map(c => `<option value=\"${esc(c.slug)}\">${esc(c.name_ar || c.slug)}</option>`).join('');
            catSel.value = cur || initialCat;

            const chipHost = document.querySelector('#cat-chips');
            if (chipHost) {
              chipHost.innerHTML =
                `<button type="button" class="chip${catSel.value ? '' : ' active'}" data-cat="">كل المنتجات</button>` +
                productCats.map(c => `<button type="button" class="chip${catSel.value === c.slug ? ' active' : ''}" data-cat="${esc(c.slug)}">${esc(c.name_ar || c.slug)}</button>`).join('');
              chipHost.querySelectorAll('[data-cat]').forEach(btn => {
                btn.addEventListener('click', () => {
                  catSel.value = btn.getAttribute('data-cat') || '';
                  chipHost.querySelectorAll('[data-cat]').forEach(x => x.classList.toggle('active', x === btn));
                  loadPage(true);
                });
              });
            }

            const linksHost = document.querySelector('#cat-links');
            if (linksHost) {
              linksHost.innerHTML = productCats.map(c =>
                `<a class="chip" href="/shop?cat=${encodeURIComponent(c.slug)}">${esc(c.name_ar || c.slug)}</a>`
              ).join('');
            }

            if (initialCat && !cur) loadPage(true);
          }
        }
      } catch (_) {}
    }

    // Section chips
    document.querySelectorAll('[data-shop-section]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        section = el.getAttribute('data-shop-section') || 'all';
        document.querySelectorAll('[data-shop-section]').forEach(x => x.classList.toggle('active', x === el));
        loadPage(true);
      });
    });

    ['#f-q','#f-cat','#f-brand','#f-price','#f-status'].forEach(sel => {
      const el = document.querySelector(sel);
      if (!el) return;
      el.addEventListener('change', () => loadPage(true));
      if (el.tagName === 'INPUT') {
        let t;
        el.addEventListener('input', () => {
          clearTimeout(t);
          t = setTimeout(() => loadPage(true), 320);
        });
      }
    });

    // Render products immediately via lightweight REST. Load filter metadata in parallel.
    grid.innerHTML = skeleton(8);
    loadPage(true);
    loadBrandsAndCats();
    renderCount();
  });
  </script>
</body>
</html>
