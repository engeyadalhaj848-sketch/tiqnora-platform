<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0A5CFF" />
  <meta name="description" content="متجر حلول تقنية Tiqnora AI في السعودية — كمبيوترات، شبكات، كاميرات مراقبة، طابعات، مكتب ذكي، وحلول AI رقمية." />
  <link rel="canonical" href="https://www.tiqnora.com/shop" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ar_SA" />
  <meta property="og:site_name" content="Tiqnora AI" />
  <meta property="og:title" content="المتجر | Tiqnora AI" />
  <meta property="og:description" content="كتالوج تقني متكامل: أجهزة، شبكات، أمن، طباعة، مكتب ذكي وحلول رقمية." />
  <meta property="og:url" content="https://www.tiqnora.com/shop" />
  <meta property="og:image" content="https://www.tiqnora.com/assets/tiqnora-logo.png" />
  <title>المتجر | Tiqnora AI</title>
  <link rel="icon" type="image/png" href="assets/tiqnora-logo.png" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .shop-filters{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:10px;margin:0 0 18px}
    .shop-filters input,.shop-filters select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit}
    .shop-meta-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;color:var(--muted);font-size:.9rem}
    @media(max-width:900px){.shop-filters{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){.shop-filters{grid-template-columns:1fr}}
  </style>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XW3K04YQMH"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-XW3K04YQMH',{anonymize_ip:true});</script>
</head>
<body>
  <header class="store-header">
    <div class="container store-nav">
      <a class="brand" href="index.html"><img src="assets/tiqnora-logo.png" alt="Tiqnora AI" /><span>Tiqnora AI</span></a>
      <nav class="store-links" aria-label="المتجر">
        <a href="index.html">الرئيسية</a>
        <a href="shop.html" class="active">المتجر</a>
        <a href="national-day.html">اليوم الوطني</a>
        <a href="track.html">تتبع الطلب</a>
      </nav>
      <a class="cart-link" href="checkout.html"> السلة <b id="store-cart-count">0</b></a>
    </div>
  </header>
  <main class="store-main">
    <div class="container">
      <h1 class="store-title">المتجر</h1>
      <p class="store-sub">كمبيوترات · شبكات · مراقبة وأمن · طابعات · مكتب ذكي · حلول AI — شحن داخل المملكة.</p>

      <div class="shop-filters" id="shop-filters">
        <input type="search" id="f-q" placeholder="ابحث عن منتج..." autocomplete="off" />
        <select id="f-cat" aria-label="القسم"><option value="">كل الأقسام</option></select>
        <select id="f-brand" aria-label="العلامة"><option value="">كل العلامات</option></select>
        <select id="f-price" aria-label="السعر">
          <option value="">كل الأسعار</option>
          <option value="0-200">حتى 200 ر.س</option>
          <option value="200-500">200 – 500</option>
          <option value="500-1500">500 – 1,500</option>
          <option value="1500-5000">1,500 – 5,000</option>
          <option value="5000-999999">أكثر من 5,000</option>
        </select>
        <select id="f-status" aria-label="الحالة">
          <option value="">كل الحالات</option>
          <option value="in">متوفر</option>
          <option value="out">غير متوفر</option>
          <option value="featured">مميز</option>
          <option value="national">عروض وطنية</option>
        </select>
      </div>

      <div class="chip-row" id="section-chips" style="margin-bottom:10px"></div>
      <div class="chip-row" id="cat-chips"></div>
      <div class="shop-meta-row"><span id="shop-result-meta"></span>
        <span id="result-count">—</span>
        <a href="faq.html" style="color:var(--accent)">الأسئلة الشائعة</a>
      </div>
      <div class="products-grid" id="products-grid">
        <p style="color:var(--muted)">جارٍ تحميل المنتجات…</p>
      </div>
    </div>
  </main>
  <section class="container" style="padding:28px 0 10px">
    <h2 style="font-size:1.2rem;margin-bottom:12px">الأقسام الرئيسية</h2>
    <div class="chip-row" id="cat-links"></div>
  </section>
  <footer class="store-footer"><div class="container">© <span id="year"></span> Tiqnora AI · <a href="national-day.html">عروض اليوم الوطني</a> · <a href="about.html">عن الشركة</a> · <a href="privacy-policy.html">الخصوصية</a> · <a href="terms.html">الشروط</a></div></footer>
  <script src="js/config.js" defer></script>
  <script src="js/db.js" defer></script>
  <script src="script.js" defer></script>
  <script src="js/analytics.js" defer></script>
  <script src="js/whatsapp.js" defer></script>
  <script defer>
  window.addEventListener('DOMContentLoaded', () => {
    const money = n => `${new Intl.NumberFormat('ar-SA').format(Number(n)||0)} ر.س`;
    const esc = s => String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    const grid = document.querySelector('#products-grid');
    const year = document.querySelector('#year'); if (year) year.textContent = new Date().getFullYear();
    const PAGE = 12;
    let offset = 0;
    let total = 0;
    let loading = false;
    let allLoaded = []; // accumulated for client filter when needed
    let section = 'all';
    let brands = [];

    const params = new URLSearchParams(location.search);
    if (params.get('cat')) {
      const el = document.querySelector('#f-cat');
      if (el) el.value = params.get('cat');
    }

    function renderCount(){
      const c = (window.TiqnoraStore?.getCart()||[]).reduce((a,i)=>a+i.qty,0);
      const el = document.querySelector('#store-cart-count');
      if (el) el.textContent = c;
    }
    function finalPrice(p){
      const d = Number(p.discount_percent)||0;
      return d > 0 ? p.price * (1 - d / 100) : Number(p.price)||0;
    }
    function inStock(p){ return !(p.track_stock && p.stock_quantity <= 0); }

    function skeleton(n = 8) {
      return Array.from({ length: n }, () =>
        `<div class="product-card" aria-hidden="true" style="pointer-events:none;opacity:.55">
          <div class="product-thumb" style="background:var(--line);min-height:160px;border-radius:12px"></div>
          <div class="product-body"><div style="height:12px;background:var(--line);border-radius:6px;margin:8px 0"></div>
          <div style="height:16px;background:var(--line);border-radius:6px;width:70%"></div></div></div>`
      ).join('');
    }

    function card(p, idx) {
      const hasDisc = Number(p.discount_percent) > 0;
      const final = finalPrice(p);
      const out = !inStock(p);
      const img = (p.images && p.images[0]) ? p.images[0] : '';
      const priority = idx < 2 ? 'fetchpriority="high"' : '';
      const lazy = idx < 2 ? '' : 'loading="lazy"';
      return `<a class="product-card" href="product.html?slug=${encodeURIComponent(p.slug)}">
        ${out ? '<span class="badge out">غير متوفر</span>' : (hasDisc ? `<span class="badge">-${Math.round(p.discount_percent)}%</span>` : (p.featured ? '<span class="badge">مميز</span>' : ''))}
        <div class="product-thumb">${img
          ? `<img src="${esc(img)}" alt="${esc(p.name_ar)}" width="400" height="400" decoding="async" ${lazy} ${priority} style="width:100%;height:auto;object-fit:cover">`
          : '▣'}</div>
        <div class="product-body">
          <span class="p-cat">${esc(p.categories?.name_ar || '')}${p.brands?.name ? ' · ' + esc(p.brands.name) : ''}</span>
          <h3>${esc(p.name_ar)}</h3>
          <div class="product-price"><strong>${money(final)}</strong>${hasDisc?`<s>${money(p.price)}</s>`:''}</div>
        </div></a>`;
    }

    function meta(shown) {
      const el = document.querySelector('#shop-result-meta');
      if (el) el.textContent = total
        ? `عرض ${shown} من ${total}`
        : (shown ? `${shown} منتج` : '');
    }

    function ensureLoadMore() {
      let btn = document.querySelector('#shop-load-more');
      if (!btn) {
        btn = document.createElement('button');
        btn.id = 'shop-load-more';
        btn.type = 'button';
        btn.className = 'button button-ghost';
        btn.style.cssText = 'display:block;margin:22px auto 8px;min-width:180px';
        btn.textContent = 'عرض المزيد';
        grid.after(btn);
        btn.addEventListener('click', () => loadPage(false));
      }
      return btn;
    }

    function applyClientSection(list) {
      if (section === 'featured') return list.filter(p => !!p.featured);
      if (section === 'best') return list; // tags often not on slim payload
      if (section === 'national') return list.filter(p => p.categories?.slug === 'national-day');
      return list;
    }

    async function loadPage(reset) {
      if (loading) return;
      loading = true;
      const btn = ensureLoadMore();
      btn.disabled = true;
      btn.textContent = 'جارٍ التحميل…';

      if (reset) {
        offset = 0;
        allLoaded = [];
        grid.innerHTML = skeleton(8);
      }

      const q = (document.querySelector('#f-q')?.value || '').trim();
      const cat = document.querySelector('#f-cat')?.value || null;
      const brand = document.querySelector('#f-brand')?.value || null;

      try {
        const ok = await window.TiqnoraDB.ready();
        if (!ok) {
          grid.innerHTML = '<p style="color:var(--muted)">تعذر تحميل المنتجات.</p>';
          return;
        }
        const page = await window.TiqnoraDB.getProductsPage({
          limit: PAGE,
          offset,
          cat: cat || null,
          brand: brand || null,
          q: q || null,
        });
        if (!page || !page.items) {
          if (reset) grid.innerHTML = '<p style="color:var(--muted)">لا توجد منتجات.</p>';
          return;
        }
        total = page.total || 0;
        let items = applyClientSection(page.items);
        if (reset) {
          allLoaded = items;
          grid.innerHTML = items.map((p, i) => card(p, i)).join('') || '<p style="color:var(--muted)">لا توجد منتجات مطابقة.</p>';
        } else {
          allLoaded = allLoaded.concat(items);
          const frag = document.createDocumentFragment();
          const wrap = document.createElement('div');
          wrap.innerHTML = items.map((p, i) => card(p, offset + i)).join('');
          while (wrap.firstChild) frag.appendChild(wrap.firstChild);
          grid.appendChild(frag);
        }
        offset += PAGE;
        meta(allLoaded.length);
        const hasMore = page.hasMore && allLoaded.length < (total || Infinity);
        btn.style.display = hasMore ? 'block' : 'none';
        btn.disabled = false;
        btn.textContent = 'عرض المزيد';
      } catch (e) {
        console.warn(e);
        if (reset) grid.innerHTML = '<p style="color:var(--muted)">تعذر تحميل المنتجات.</p>';
        btn.disabled = false;
        btn.textContent = 'عرض المزيد';
      } finally {
        loading = false;
        renderCount();
      }
    }

    async function loadBrandsAndCats() {
      try {
        const [brandRows, catRows] = await Promise.all([
          window.TiqnoraDB.getBrands?.() || [],
          window.TiqnoraDB.getCategories?.() || [],
        ]);
        brands = brandRows || [];
        const brandSel = document.querySelector('#f-brand');
        if (brandSel && brands.length) {
          const cur = brandSel.value;
          brandSel.innerHTML = '<option value=\"\">كل العلامات</option>' +
            brands.map(b => `<option value=\"${esc(b.slug)}\">${esc(b.name || b.name_ar || b.slug)}</option>`).join('');
          brandSel.value = cur;
        }
        const catSel = document.querySelector('#f-cat');
        if (catSel && catRows && catRows.length) {
          const cur = catSel.value;
          const productCats = catRows.filter(c => !c.type || c.type === 'product' || c.type === 'products');
          if (productCats.length) {
            catSel.innerHTML = '<option value=\"\">كل التصنيفات</option>' +
              productCats.map(c => `<option value=\"${esc(c.slug)}\">${esc(c.name_ar || c.slug)}</option>`).join('');
            catSel.value = cur;
          }
        }
      } catch (_) {}
    }

    // Section chips
    document.querySelectorAll('[data-shop-section]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        section = el.getAttribute('data-shop-section') || 'all';
        document.querySelectorAll('[data-shop-section]').forEach(x => x.classList.toggle('active', x === el));
        loadPage(true);
      });
    });

    ['#f-q','#f-cat','#f-brand','#f-price','#f-status'].forEach(sel => {
      const el = document.querySelector(sel);
      if (!el) return;
      el.addEventListener('change', () => loadPage(true));
      if (el.tagName === 'INPUT') {
        let t;
        el.addEventListener('input', () => {
          clearTimeout(t);
          t = setTimeout(() => loadPage(true), 320);
        });
      }
    });

    // Immediate skeleton, then products first (don't block on brands)
    grid.innerHTML = skeleton(8);
    loadPage(true);
    window.TiqnoraDB.ready().then(() => loadBrandsAndCats());
    renderCount();
  });
  </script>
</body>
</html>
