<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مقال | Tiqnora AI</title>
  <meta name="description" content="مقال من مدونة Tiqnora AI" />
  <meta name="robots" content="index, follow" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="/marketing.css" />
</head>
<body>
  <div class="wrap">
    <nav class="nav"><b>Tiqnora AI</b><a href="/blog">المدونة</a><a href="/customer">بوابة العملاء</a><a href="/">الرئيسية</a></nav>
    <article id="post"><p class="lead">جارٍ التحميل…</p></article>
    <div class="cta"><a class="btn btn-primary" href="/customer">جرّب المنصة</a><a class="btn btn-ghost" href="/#contact">تواصل</a></div>
    <div class="footer">© Tiqnora AI</div>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/db.js"></script>
  <script src="/js/supabase-client-fix.js"></script>
  <script>
  (async () => {
    const slug = location.pathname.split('/').filter(Boolean).pop() || new URLSearchParams(location.search).get('slug');
    await window.TiqnoraDB.ready();
    const db = window.TiqnoraDB.raw;
    const el = document.getElementById('post');
    if (!db || !slug || slug === 'blog-post') { el.innerHTML = '<p>مقال غير موجود</p>'; return; }
    const { data: p, error } = await db.from('blog_posts').select('*').eq('slug', slug).eq('status','published').maybeSingle();
    if (error || !p) { el.innerHTML = '<p class="lead">المقال غير متاح</p>'; return; }
    document.title = (p.seo_title || p.title_ar) + ' | Tiqnora AI';
    const md = document.querySelector('meta[name=description]');
    if (md) md.content = p.seo_description || p.excerpt_ar || '';
    let link = document.querySelector('link[rel=canonical]');
    if (!link) { link = document.createElement('link'); link.rel = 'canonical'; document.head.appendChild(link); }
    link.href = 'https://www.tiqnora.com/blog/' + p.slug;
    const body = (p.body_ar||'').split(/\n\n+/).map(block => {
      if (block.startsWith('## ')) return '<h2>' + block.slice(3) + '</h2>';
      return '<p>' + block.replace(/\n/g,'<br>') + '</p>';
    }).join('');
    el.innerHTML = `<header class="hero"><h1>${p.title_ar}</h1><p class="lead">${p.excerpt_ar||''}</p></header><div class="card prose">${body}</div>`;
  })();
  </script>
</body>
</html>
