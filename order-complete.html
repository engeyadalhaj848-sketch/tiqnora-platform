<!doctype html>
<html lang="ar" dir="rtl" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,follow" />
  <title>حالة الدفع | Tiqnora AI</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/tiqnora-logo.png" />
</head>
<body>
  <header class="store-header"><div class="container store-nav">
    <a class="brand" href="index.html"><img src="assets/tiqnora-logo.png" alt="Tiqnora AI" /><span>Tiqnora AI</span></a>
  </div></header>
  <main class="store-main"><div class="container" style="max-width:560px">
    <h1 class="store-title">حالة الدفع</h1>
    <div class="panel" id="status-box"><p style="color:var(--muted)">جارٍ التحقق…</p></div>
    <p style="margin-top:16px"><a href="shop.html">المتجر</a> · <a href="track.html" id="track-link">تتبع</a></p>
  </div></main>
  <script>
  document.addEventListener('DOMContentLoaded', async () => {
    const order = new URLSearchParams(location.search).get('order') || '';
    const box = document.getElementById('status-box');
    const track = document.getElementById('track-link');
    if (order) track.href = 'track.html?order=' + encodeURIComponent(order);
    if (!order) { box.innerHTML = '<p>لا يوجد رقم طلب.</p>'; return; }
    async function poll() {
      try {
        const r = await fetch('/api/payments/order-status?order=' + encodeURIComponent(order));
        const d = await r.json();
        if (!d.ok) { box.innerHTML = '<p>تعذر العثور على الطلب.</p>'; return true; }
        if (d.paid) {
          box.innerHTML = `<p><strong>تم تأكيد الدفع</strong></p><p>رقم الطلب: <b dir="ltr">${d.order_number}</b></p><p>${d.total} ${d.currency||'SAR'}</p>`;
          return true;
        }
        box.innerHTML = `<p><strong>${d.message||'جارٍ التحقق من عملية الدفع'}</strong></p><p dir="ltr">${d.order_number}</p>`;
        return false;
      } catch { box.innerHTML = '<p>تعذر الاتصال.</p>'; return false; }
    }
    let done = await poll();
    if (!done) { let n=0; const t=setInterval(async()=>{ n++; done=await poll(); if(done||n>=10) clearInterval(t); }, 3000); }
  });
  </script>
</body>
</html>
