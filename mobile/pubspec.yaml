name: tiqnora_mobile
description: Tiqnora AI — Official mobile app (Customer + Admin by role)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Supabase
  supabase_flutter: ^2.9.0

  # Networking
  dio: ^5.8.0+1

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Routing
  go_router: ^14.8.1

  # UI / UX
  google_fonts: ^6.2.1
  intl: ^0.20.2

  # Utils
  shared_preferences: ^2.5.2
  connectivity_plus: ^6.1.3
  package_info_plus: ^8.3.0
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: false

  assets:
    - assets/images/
    - assets/icons/
