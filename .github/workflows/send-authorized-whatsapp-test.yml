name: One-shot authorized WhatsApp test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/send-authorized-whatsapp-test.yml'

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send authorized Tiqnora website-design message
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt"
            if response="$(curl -sS --fail-with-body --max-time 30 'https://tiqnora.com/api/social/oauth/whatsapp-authorized-test')"; then
              echo "$response"
              exit 0
            fi
            sleep 12
          done
          exit 1
